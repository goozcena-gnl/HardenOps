---
- name: Create isolated unprivileged filesystem test container
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Start disposable distribution container
      community.docker.docker_container:
        name: "{{ item.name }}"
        image: "{{ item.image }}"
        command: sleep infinity
        state: started
        privileged: false
        log_driver: json-file
      loop: "{{ molecule_yml.platforms }}"
