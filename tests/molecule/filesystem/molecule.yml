---
prerun: false
shared_state: false
dependency:
  name: galaxy
  enabled: false
driver:
  name: default
platforms:
  - name: hardenops-filesystem-test
    image: ${HARDENOPS_TEST_IMAGE:-ubuntu:24.04}
    groups:
      - hardenops
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/ansible/roles
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/.collections
  inventory:
    host_vars:
      hardenops-filesystem-test:
        ansible_connection: community.docker.docker
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
