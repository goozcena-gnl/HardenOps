  - id: "bp028_r13_disable_ipv6"
    source:
      document: "ANSSI-BP-028"
      recommendation: "R13"
      page: 22
    level: "intermediary"
    domain: "network"
    title: "Disable IPv6 only when unused"
    description: >-
      If IPv6 is unnecessary, review the kernel boot flag and both sysctls specified by R13 as a single planned lifecycle
      change.
    applicability:
      os_families:
        - "Debian"
        - "RedHat"
      ipv6_unused: true
    enforcement:
      status: "MANUAL"
    verification:
      type: "manual"
    reversible: false
    transition: "manual"
    reboot_required: true
    risk: "high"
    notes: >-
      Default ipv6_required=true makes this NOT_APPLICABLE. With false it remains MANUAL: v0.1 does not edit bootloaders
      or pretend runtime-only disablement fully implements R13. Current SSH/network use must be reviewed.
  - id: "bp028_r32_session_lock"
    source:
      document: "ANSSI-BP-028"
      recommendation: "R32"
      page: 35
    level: "intermediary"
    domain: "accounts"
    title: "Review inactivity locking of local sessions"
    description: "Local console TTY and graphical sessions must lock after an appropriate inactivity interval."
    applicability:
      os_families:
        - "Debian"
        - "RedHat"
    enforcement:
      status: "MANUAL"
    verification:
      type: "manual"
    reversible: false
    transition: "manual"
    reboot_required: false
    risk: "low"
    notes: >-
      The source does not mandate a universal timeout value. Shell TMOUT logs out selected shells and is not equivalent to
      locking all local sessions.
