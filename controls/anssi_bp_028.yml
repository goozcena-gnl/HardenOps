  - id: "bp028_r50_shadow"
    source:
      document: "ANSSI-BP-028"
      recommendation: "R50"
      page: 48
    level: "intermediary"
    domain: "filesystem"
    title: "Restrict /etc/shadow permissions"
    description: >-
      Limit access to this existing sensitive authentication database to root and its trusted distribution group.
    applicability:
      os_families:
        - "Debian"
        - "RedHat"
    enforcement:
      status: "AUTOMATED"
      implementation: "ansible/roles/filesystem/tasks/permissions.yml"
    verification:
      type: "file"
      path: "/etc/shadow"
      max_mode: "0640"
      allowed_groups:
        - "root"
        - "shadow"
    reversible: true
    transition: "reversible"
    reboot_required: false
    risk: "medium"
    notes: >-
      Subset of R50, not a scan of all secrets. Preserve stricter mode bits and trusted group ownership; never add
      permissions. The shadow group must remain restricted to principals with a strict need to know. Do not follow
      symlinks or create absent authentication databases.
