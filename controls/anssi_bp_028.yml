  - id: "bp028_r9_dmesg_restrict"
    source:
      document: "ANSSI-BP-028"
      recommendation: "R9"
      page: 19
    level: "intermediary"
    domain: "kernel"
    title: "Restrict access to kernel messages"
    description: "Apply the selected R9 runtime parameter kernel.dmesg_restrict with a minimum baseline of 1."
    applicability:
      os_families:
        - "Debian"
        - "RedHat"
    enforcement:
      status: "AUTOMATED"
      implementation: "ansible/roles/kernel/tasks/runtime.yml"
    verification:
      type: "sysctl"
      key: "kernel.dmesg_restrict"
      expected: "1"
      accepted_values:
        - "1"
      remediable_values:
        - "0"
    reversible: true
    transition: "reversible"
    reboot_required: false
    risk: "low"
    notes: "A missing kernel interface is UNSUPPORTED. Verify the live value independently."
