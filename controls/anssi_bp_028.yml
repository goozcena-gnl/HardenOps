    applicability:
      os_families:
        - "Debian"
        - "RedHat"
    enforcement:
      status: "AUTOMATED"
      implementation: "ansible/roles/kernel/tasks/runtime.yml"
    verification:
      type: "sysctl"
      key: "kernel.sysrq"
      expected: "0"
      accepted_values:
        - "0"
      remediable_range:
        - 1
