---
name: Candidate lock graph closure
on:
  pull_request:
    paths:
      - 'requirements-dev.*'
      - 'locks/**'
      - 'tools/check_lock_graph.py'
      - 'tests/test_check_lock_graph.py'
      - '.github/workflows/lock-graph-validation.yml'
  push:
    branches: [main]
    paths:
      - 'requirements-dev.*'
      - 'locks/**'
      - 'tools/check_lock_graph.py'
      - 'tests/test_check_lock_graph.py'
      - '.github/workflows/lock-graph-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.org/simple
jobs:
  lock-graph:
    name: lock-graph (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            lock: locks/py312.txt
          - python: '3.13'
            lock: locks/py313.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install explicit compiler versions
        run: |
          unset PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST
          python -m pip install --only-binary=:all: \
            pip==26.2.1 pip-tools==7.6.2 pytest==9.1.1 \
            build==1.6.1 click==8.5.0 packaging==26.3 \
            pyproject-hooks==1.3.3 setuptools==84.0.0 wheel==0.48.0 \
            iniconfig==2.3.1 pluggy==1.6.0 pygments==2.21.0
          python -m pip check
          pip-compile --version
      - name: Exercise negative injection tests
        run: python -m pytest -q tests/test_check_lock_graph.py
      - name: Independently recompile under selected interpreter
        env:
          LOCK_FILE: ${{ matrix.lock }}
          PYTHON_MINOR: ${{ matrix.python }}
        run: |
          set -eu
          unset PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST
          python - <<'PY'
          import os
          import sys
          expected = tuple(map(int, os.environ["PYTHON_MINOR"].split(".")))
          assert sys.version_info[:2] == expected, "Wrong resolver interpreter"
          print("resolver:", sys.version)
          PY
          minor="${PYTHON_MINOR//./}"
          reference="$RUNNER_TEMP/reference-py${minor}.txt"
          # Existing output is a constraint for no-upgrade regeneration,
          # not the authoritative source of package relationships.
          cp "$LOCK_FILE" "$reference"
          pip-compile \
            --generate-hashes \
            --allow-unsafe \
            --resolver=backtracking \
            --index-url https://pypi.org/simple \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file "$reference" \
            requirements-dev.in
          python tools/check_lock_graph.py \
            --python "$PYTHON_MINOR" \
            --production requirements-dev.txt \
            --direct requirements-dev.in \
            --lock "$LOCK_FILE" \
            --independent "$reference"
