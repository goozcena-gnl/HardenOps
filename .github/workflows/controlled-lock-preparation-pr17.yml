---
# Temporary, unmerged, PR-only hosted test harness: never deploy this file to main.
# No secrets, write token, commit, push, merge or Dependabot PR modifications.
name: Controlled Dependabot lock preparation (PR17)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ci/fix-prepare-dependabot-lock-only-binary]
    paths: ['.github/workflows/controlled-lock-preparation-pr17.yml']
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: controlled-lock-preparation-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Validate Dependabot PR ${{ matrix.pr_number }} (3.12 + 3.13)
    if: >-
      github.event.pull_request.user.login == 'goozcena-gnl' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/test-lock-preparation-pr17' &&
      github.event.pull_request.base.sha == '58fae70533c48afc1ad4636e4bc6b65a742b2673'
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr_number: 15
            expected_head: c7e0268bf9cada14c4d7cb8f1d86c609674ba989
            expected_base: be9cb3e0c4b21fcb567d240fb37e9519fce6015b
          - pr_number: 16
            expected_head: 2d7fb9d6da7525ac76b40324d6a0af103752032a
            expected_base: be9cb3e0c4b21fcb567d240fb37e9519fce6015b
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PIP_CONFIG_FILE: /dev/null
      PIP_INDEX_URL: https://pypi.org/simple
      # Enforce wheel-only bootstrapping via pip install --only-binary=:all:.
      # A global PIP_ONLY_BINARY makes pip-compile emit a forbidden lock directive.
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout trusted main without retained write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: 58fae70533c48afc1ad4636e4bc6b65a742b2673
          persist-credentials: false
      - name: Validate source Dependabot PR before reading candidate input
        env:
          GH_TOKEN: ${{ github.token }}
          # This PR-only harness simulates the main-targeting event context.
          # Authenticated API checks still enforce real bot PR main/base SHA.
          GITHUB_BASE_REF: main
          PR_NUMBER: ${{ matrix.pr_number }}
          EXPECTED_HEAD: ${{ matrix.expected_head }}
          TARGET_BASE_SHA: ${{ matrix.expected_base }}
        run: |
          set -eu
          python tools/prepare_dependabot_locks.py \
            --pr "$PR_NUMBER" --expected-head "$EXPECTED_HEAD"
      - name: Set up first independent resolver (Python 3.12)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Recompile and verify Python 3.12 lock
        run: |
          set -eu
          unset PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST
          python -m pip install --only-binary=:all: \
            pip==26.2.1 pip-tools==7.6.2 pytest==9.1.1 \
            build==1.6.1 click==8.5.0 packaging==26.3 \
            pyproject-hooks==1.3.3 setuptools==84.0.0 wheel==0.48.0 \
            iniconfig==2.3.1 pluggy==1.6.0 pygments==2.21.0
          python -m pip check
          python -m pytest -q tests/unit/test_prepare_dependabot_locks.py \
            tests/test_check_lock_graph.py
          python -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          pip-compile --generate-hashes --no-reuse-hashes --allow-unsafe \
            --resolver=backtracking --index-url https://pypi.org/simple \
            --no-emit-index-url --no-emit-trusted-host \
            --output-file locks/py312.txt requirements-dev.in
          cp locks/py312.txt "$RUNNER_TEMP/ref-py312.txt"
          pip-compile --generate-hashes --no-reuse-hashes --allow-unsafe \
            --resolver=backtracking --index-url https://pypi.org/simple \
            --no-emit-index-url --no-emit-trusted-host \
            --output-file "$RUNNER_TEMP/ref-py312.txt" requirements-dev.in
          python tools/check_lock_graph.py --python 3.12 \
            --production requirements-dev.txt --direct requirements-dev.in \
            --lock locks/py312.txt --independent "$RUNNER_TEMP/ref-py312.txt"
      - name: Set up second independent resolver (Python 3.13)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Recompile and verify Python 3.13 lock
        run: |
          set -eu
          unset PIP_EXTRA_INDEX_URL PIP_TRUSTED_HOST
          python -m pip install --only-binary=:all: \
            pip==26.2.1 pip-tools==7.6.2 pytest==9.1.1 \
            build==1.6.1 click==8.5.0 packaging==26.3 \
            pyproject-hooks==1.3.3 setuptools==84.0.0 wheel==0.48.0 \
            iniconfig==2.3.1 pluggy==1.6.0 pygments==2.21.0
          python -m pip check
          python -m pytest -q tests/unit/test_prepare_dependabot_locks.py \
            tests/test_check_lock_graph.py
          python -c 'import sys; assert sys.version_info[:2] == (3, 13)'
          pip-compile --generate-hashes --no-reuse-hashes --allow-unsafe \
            --resolver=backtracking --index-url https://pypi.org/simple \
            --no-emit-index-url --no-emit-trusted-host \
            --output-file locks/py313.txt requirements-dev.in
          cp locks/py313.txt "$RUNNER_TEMP/ref-py313.txt"
          pip-compile --generate-hashes --no-reuse-hashes --allow-unsafe \
            --resolver=backtracking --index-url https://pypi.org/simple \
            --no-emit-index-url --no-emit-trusted-host \
            --output-file "$RUNNER_TEMP/ref-py313.txt" requirements-dev.in
          python tools/check_lock_graph.py --python 3.13 \
            --production requirements-dev.txt --direct requirements-dev.in \
            --lock locks/py313.txt --independent "$RUNNER_TEMP/ref-py313.txt"
      - name: Produce review-only repair bundle
        run: |
          set -eu
          git diff --check
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          files = ('requirements-dev.in', 'requirements-dev.txt',
                   'locks/py312.txt', 'locks/py313.txt')
          observed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True).splitlines())
          if observed != set(files):
              raise SystemExit(f'Unexpected regenerated scope: {sorted(observed)}')
          out = Path('dependabot-lock-bundle')
          (out / 'locks').mkdir(parents=True)
          for name in files:
              original = Path(name)
              (out / name).write_bytes(original.read_bytes())
          manifest = json.loads(Path('dependabot-lock-manifest.json').read_text())
          manifest['sha256'] = {name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                                for name in files}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          (out / 'README.txt').write_text(
              'Review the manifest and files. Update the target Dependabot branch '
              'with these four files through a maintainer-controlled commit; '
              'do NOT merge before required CI and graph checks pass.\n'
          )
          PY
      - name: Upload immutable patch bundle for maintainer review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: isolated-validated-locks-pr-${{ matrix.pr_number }}
          path: dependabot-lock-bundle/
          if-no-files-found: error
          retention-days: 7
