---
name: Filesystem integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  molecule:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'rockylinux:9']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: locks/py312.txt
      - name: Authenticate controller bootstrap
        run: >-
          python tools/bootstrap_python.py prepare
          --venv "$RUNNER_TEMP/hardenops-controller-venv"
          --github-env "$GITHUB_ENV"
          --github-path "$GITHUB_PATH"
      - name: Install pinned controller tools and collections
        run: make install
      - name: Converge, verify real file state and test idempotence
        run: make molecule IMAGE='${{ matrix.image }}'
      - name: Clean up disposable containers after a failed test
        if: always()
        env:
          MOLECULE_GLOB: tests/molecule/*/molecule.yml
          HARDENOPS_TEST_IMAGE: '${{ matrix.image }}'
        run: molecule destroy -s filesystem
