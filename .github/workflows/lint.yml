---
name: Static validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned controller tools and collections
        run: make install
      - name: Validate YAML, Ansible syntax, catalogue, profiles and Python behavior
        run: make lint validate test
      - name: Validate Vagrant Ruby syntax
        run: ruby -c Vagrantfile
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install secret and dependency checkers
        # These are public package version pins, not credentials.
        run: python -m pip install detect-secrets==1.5.0 pip-audit==2.10.1  # pragma: allowlist secret
      - name: Scan tracked files for secrets and requirements for known vulnerabilities
        run: make hygiene
